[project]
name = "burger-ordering-agent"
version = "0.1.0"
description = "AI ordering assistant for Stand Up Burger (LiveKit + Gemini Live)"
requires-python = ">=3.10, <3.15"

dependencies = [
    "livekit-agents[bey,google]~=1.8",
    "livekit-plugins-ai-coustics~=0.3",
    "python-dotenv",
]

[tool.uv]
constraint-dependencies = ["yarl<1.24", "cryptography<49", "google-genai<3"]
